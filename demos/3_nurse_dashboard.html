<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ED waiting room monitor — demo</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F4F5F7;font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#101828}
button,select,input,textarea{font-family:inherit}
.wrap{min-height:100vh;padding:20px 24px 32px;display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border:1px solid #E4E7EC;border-radius:12px}
.stat{background:#fff;border:1px solid #E4E7EC;border-radius:10px;padding:8px 14px;display:flex;flex-direction:column}
.stat span:first-child{font-size:12px;color:#475467}.stat span:last-child{font-size:20px;font-weight:700}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px}
.row{display:grid;grid-template-columns:70px 1.6fr 60px 92px 78px 1.5fr 1.4fr;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 16px;border:none;border-bottom:1px solid #EAECF0;color:#101828;cursor:pointer;min-height:56px;font-size:14px}
.row:hover{filter:brightness(0.98)}
.hdr{display:grid;grid-template-columns:70px 1.6fr 60px 92px 78px 1.5fr 1.4fr;gap:10px;padding:10px 16px;font-size:12px;font-weight:600;color:#475467;background:#F9FAFB;border-bottom:1px solid #E4E7EC}
.sec{padding:16px;display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font-size:14px;font-weight:700}
.cell{background:#F9FAFB;border-radius:8px;padding:8px 10px}.cell .k{color:#475467;font-size:12px}.cell .v{font-weight:600}
.btn{min-height:44px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid #D0D5DD;background:#fff;color:#101828}
.btn.primary{border:none;background:#101828;color:#fff}
.btn.on{outline:3px solid #F79009;outline-offset:1px}
form.f{border:1px solid #D0D5DD;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#F9FAFB}
form.f label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
form.f select,form.f input{min-height:40px;border:1px solid #D0D5DD;border-radius:8px;padding:0 8px;font-size:14px;background:#fff}
form.f textarea{border:1px solid #D0D5DD;border-radius:8px;padding:8px;font-size:14px;resize:vertical}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.muted{font-size:12px;color:#475467}
</style>
</head>

  function render() {
    var open = 0;
    list.forEach(function (p) { if (ALERT[p.st] && !st.handled[p.seat]) open++; });
    var h = '<div class="wrap">';
    h += '<header style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px"><div><div style="font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#475467">Emergency department · Triage station 1</div><h1 style="margin:0;font-size:24px">Waiting room monitor</h1></div>';
    h += '<div style="display:flex;flex-wrap:wrap;gap:8px"><div class="stat"><span>Waiting</span><span>' + list.length + '</span></div><div class="stat"><span>Open alerts</span><span style="color:#B42318">' + open + '</span></div><div class="stat"><span>Longest wait</span><span>3 h 05 m</span></div><div class="stat"><span>Alerts / nurse / hr</span><span>2.1 <small style="font-size:12px;font-weight:500;color:#475467">budget 4</small></span></div><button class="btn" data-a="reset" style="align-self:center">Reset demo</button></div></header>';
    if (!st.acked && !st.handled['W-11']) {
      h += '<section style="background:#FEE4E2;border:2px solid #B42318;border-radius:12px;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:16px"><div style="background:#B42318;color:#fff;font-size:12px;font-weight:700;letter-spacing:.06em;border-radius:6px;padding:6px 10px">CRITICAL · GO NOW</div><div style="flex:999 1 420px;min-width:0"><div style="font-size:16px;font-weight:700;color:#7A271A">Seat W-11 · M, 33 · RR 7/min and SpO₂ 86% for 45 s · no movement</div><div style="font-size:13px;color:#7A271A">Received naloxone 1 h 40 m ago (opioid sensitivity profile). Rule: RR ≤ 8 + SpO₂ ≤ 88% sustained 30 s + motion absent.</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><div style="font-size:13px;font-weight:600;color:#7A271A">Unacknowledged 1:12 · escalates to charge nurse at 2:00</div><div style="display:flex;gap:8px"><button class="btn" data-a="ack" style="border:none;background:#B42318;color:#fff">Acknowledge · I\'m going</button><button class="btn" data-a="sel" data-s="W-11" style="border-color:#B42318;color:#B42318">Open patient</button></div></div></section>';
    } else {
      h += '<section style="background:#ECFDF3;border:1px solid #067647;border-radius:12px;padding:12px 16px;font-size:14px;color:#054F31;font-weight:500">Critical alert for W-11 acknowledged · bedside reassessment in progress · outcome must be logged within 15 min.</section>';
    }
    h += '<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">';
    // list
    h += '<main class="card" style="flex:999 1 640px;min-width:0"><div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid #E4E7EC"><h2 style="margin:0;font-size:16px">Patients waiting · sorted by alert, then AI risk</h2><div style="display:flex;flex-wrap:wrap;gap:6px"><span class="pill" style="background:#FEE4E2;color:#912018">● Critical: go now</span><span class="pill" style="background:#FEF0C7;color:#93370D">▲ Urgent: reassess ≤ 15 min</span><span class="pill" style="background:#D1E9FF;color:#194185">◆ Watch: next check</span><span class="pill" style="background:#F2F4F7;color:#344054">○ Stable</span></div></div><div style="overflow-x:auto"><div style="min-width:860px"><div class="hdr"><span>Seat</span><span>Patient · complaint</span><span>CTAS</span><span>AI risk</span><span>Waiting</span><span>Live vitals</span><span>Status</span></div>';
    list.forEach(function (p) {
      var s = S[p.st], sel = p.seat === st.sel, hd = !!st.handled[p.seat];
      var bg = sel ? '#EFF4FF' : (p.st === 'critical' && !hd ? '#FFF6F5' : '#FFFFFF');
      var lab = hd && ALERT[p.st] ? s.label + ' · handled' : s.label;
      h += '<button class="row" data-a="sel" data-s="' + p.seat + '" style="background:' + bg + ';' + (sel ? 'box-shadow:inset 4px 0 0 #1D4ED8;' : '') + '">';
      h += '<span style="font-weight:700">' + p.seat + '</span><span><div style="font-weight:600">' + p.who + '</div><div style="font-size:12px;color:#475467">' + p.complaint + '</div></span>';
      h += '<span style="font-weight:600">' + ctasOf(p) + (st.ctas[p.seat] ? ' ↑' : '') + '</span><span><span class="pill" style="' + R[p.risk] + '">' + p.risk + '</span></span><span>' + p.wait + '</span>';
      h += '<span style="font-size:12px;color:#344054"><div>' + p.v1 + '</div><div>' + p.v2 + '</div></span>';
      h += '<span>' + pill(s, hd ? ';opacity:.75' : '') + lab + '</span><div style="font-size:12px;color:#475467;margin-top:4px">' + (hd ? 'Reassessed ' + hm(st.last[p.seat]) : p.reason) + '</div></span></button>';
    });
    h += '</div></div></main>';
    // detail
    var d = byseat(st.sel), ds = S[d.st], ch = CH[d.seat];
    var last = st.last[d.seat] || toMin(ch[0]), every = st.every[d.seat] || ch[1], due = last + every, over = due < st.clock;
    var hd = !!st.handled[d.seat];
    h += '<aside style="flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:12px">';
    h += '<section class="card sec"><div style="display:flex;justify-content:space-between;gap:8px"><div><div class="muted">Seat ' + d.seat + ' · arrived ' + d.arrived + ' · waiting ' + d.wait + '</div><h2 style="margin:2px 0 0;font-size:18px">' + d.who + ' · ' + d.complaint + '</h2></div>' + pill(ds, ';white-space:nowrap') + (hd && ALERT[d.st] ? ds.label + ' · handled' : ds.label) + '</span></div>';
    h += '<div class="g2" style="font-size:13px"><div class="cell"><div class="k">Triage</div><div class="v">CTAS ' + ctasOf(d) + '</div></div><div class="cell" style="background:#F5F3FF"><div class="k" style="color:#5B21B6">AI risk tier (layer 1)</div><div class="v" style="color:#4C1D95">' + d.risk + ' · ' + d.riskWhy + '</div></div><div class="cell"><div class="k">Threshold profile</div><div class="v">' + esc(st.custom[d.seat] || d.profile) + '</div></div><div class="cell"><div class="k">Devices · continuous</div><div class="v">' + d.devices + '</div></div><div class="cell"><div class="k">Last in-person nurse check</div><div class="v">' + hm(last) + ' · every ' + every + ' min</div></div><div class="cell" style="' + (over ? 'background:#FEE4E2;color:#912018' : '') + '"><div class="k">Next in-person check</div><div class="v">' + (over ? 'Overdue by ' + (st.clock - due) + ' min' : 'Due ' + hm(due)) + '</div></div></div></section>';
    // actions
    h += '<section class="card sec"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3>Suggested next steps · nurse decides</h3><button class="btn" data-a="all" style="min-height:36px;padding:0 12px;border-color:#A78BFA;background:#F5F3FF;color:#4C1D95;font-size:13px">Accept all</button></div>';
    d.steps.forEach(function (t, i) {
      var k = d.seat + '-' + i;
      h += '<label style="display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;cursor:pointer"><input type="checkbox" data-a="chk" data-i="' + i + '"' + (st.checked[k] ? ' checked' : '') + ' style="width:18px;height:18px;margin:1px 0 0"><span>' + t + '</span></label>';
    });
    h += '<div style="display:flex;flex-wrap:wrap;gap:8px;padding-top:4px"><button class="btn primary' + (st.mode === 'reassess' ? ' on' : '') + '" data-a="mode" data-m="reassess">Reassess now</button><button class="btn' + (st.mode === 'triage' ? ' on' : '') + '" data-a="mode" data-m="triage">Up-triage CTAS</button><button class="btn' + (st.mode === 'threshold' ? ' on' : '') + '" data-a="mode" data-m="threshold">Adjust threshold…</button></div>';
    var err = st.err ? '<div role="alert" style="font-size:13px;color:#B42318">' + esc(st.err) + '</div>' : '';
    var foot = function (label) { return err + '<div style="display:flex;gap:8px"><button type="submit" class="btn primary">' + label + '</button><button type="button" class="btn" data-a="close">Cancel</button></div></form>'; };
    if (st.mode === 'reassess') {
      var po = ''; for (var k = 0; k <= 10; k++) po += '<option>' + k + '</option>';
      h += '<form class="f" data-f="reassess"><div style="font-size:14px;font-weight:700">Bedside reassessment · ' + d.seat + '</div><div class="muted">Devices already capture HR, RR, SpO₂ and activity. Record what they can\'t.</div><div class="g2"><label>Pain (0–10)<select name="pain">' + po + '</select></label><label>Level of consciousness<select name="loc"><option>Alert</option><option>New confusion</option><option>Responds to voice</option><option>Responds to pain</option><option>Unresponsive</option></select></label></div><label>Nurse impression (required)<select name="imp"><option value="">Choose…</option><option value="Better">Better than last check</option><option value="Same">Same</option><option value="Worse">Worse</option></select></label><label>Note (optional)<textarea name="note" rows="2"></textarea></label>' + foot('Save reassessment');
    } else if (st.mode === 'triage') {
      var co = ''; for (var c = ctasOf(d) - 1; c >= 1; c--) co += '<option value="' + c + '">CTAS ' + c + ' · ' + NAMES[c] + '</option>';
      h += '<form class="f" data-f="triage"><div style="font-size:14px;font-weight:700">Up-triage · ' + d.seat + ' · currently CTAS ' + ctasOf(d) + '</div><div class="muted">Only a nurse can change CTAS. The system can\'t do it on its own.</div><label>New CTAS level<select name="newCtas"><option value="">Choose…</option>' + co + '</select></label><label>Reason (required)<textarea name="reason" rows="2"></textarea></label>' + foot('Confirm up-triage');
    } else if (st.mode === 'threshold') {
      h += '<form class="f" data-f="threshold"><div style="font-size:14px;font-weight:700">Adjust alarm limit · ' + d.seat + '</div><div class="muted">For patients whose normal differs from the default (e.g. a resting HR of 50). Auto-reverts after 2 h. Safety floors can\'t be crossed.</div><div class="g2"><label>Limit<select name="param"><option value="hr">HR lower limit (bpm)</option><option value="spo2">SpO₂ lower limit (%)</option><option value="rr">RR upper limit (/min)</option></select></label><label>New value<input type="number" name="val"></label></div><div class="muted">Safety floors: HR ≥ 40 bpm · SpO₂ ≥ 85% · RR ≤ 30/min</div><label>Reason (required)<textarea name="reason" rows="2"></textarea></label>' + foot('Apply for 2 h');
    }
    h += '</section>';
    // trends
    h += '<section class="card sec" style="gap:8px"><h3>Last 60 min · vs personal baseline</h3>';
    [['Heart rate', d.hr, d.hrLo, d.hrHi, d.hrBase, ' bpm', '#C4320A'], ['Respiratory rate', d.rr, d.rrLo, d.rrHi, d.rrBase, '/min', '#1849A9']].forEach(function (t) {
      h += '<div><div style="display:flex;justify-content:space-between;font-size:12px;color:#475467"><span>' + t[0] + '</span><span style="font-weight:600;color:#101828">now ' + t[1][t[1].length - 1] + t[5] + ' · baseline ' + t[4] + '</span></div><svg viewBox="0 0 320 56" width="100%" height="56" role="img" aria-label="' + t[0] + ' trend"><line x1="0" y1="' + by(t[4], t[2], t[3]) + '" x2="320" y2="' + by(t[4], t[2], t[3]) + '" stroke="#98A2B3" stroke-dasharray="4 4"/><polyline points="' + spark(t[1], t[2], t[3]) + '" fill="none" stroke="' + t[6] + '" stroke-width="2.5" stroke-linejoin="round"/></svg></div>';
    });
    h += '<div class="muted">Dashed line = this patient\'s baseline from the first 15 min on the device. SpO₂ ' + d.spo2 + ' · BP ' + d.bp + ' · Temp ' + d.temp + '</div></section>';
    h += '<section class="card sec" style="gap:8px"><h3>Why this alert (layer 2 · clinical rules)</h3>' + d.rules.map(function (r) { return '<div style="font-size:13px;line-height:1.45">• ' + r + '</div>'; }).join('') + '</section>';
    h += '<section style="background:#F5F3FF;border:1px solid #DDD6FE;border-radius:12px" class="sec"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="color:#4C1D95">Prediction · next 2 h (layer 3)</h3><span style="font-size:11px;font-weight:700;letter-spacing:.05em;color:#5B21B6;border:1px solid #A78BFA;border-radius:999px;padding:3px 8px">ADVISORY ONLY</span></div><div><span style="font-size:32px;font-weight:700;color:#4C1D95">' + d.pred + '</span> <span style="font-size:13px;color:#5B21B6">' + d.predChange + '</span></div><div style="font-size:13px;color:#4C1D95;line-height:1.45">' + d.predWhy + '</div><div style="font-size:12px;color:#5B21B6">Does not move the patient ahead of higher-acuity patients. Suggests low-cost actions only.</div></section>';
    var logs = st.logs[d.seat] || [], LS = { nurse: '#101828', system: '#344054', ai: '#5B21B6' }, LP = { nurse: 'Nurse: ', system: 'System: ', ai: 'AI: ' };
    h += '<section class="card sec" style="gap:8px"><h3>Activity log · ' + d.seat + '</h3>' + (logs.length ? logs.map(function (l) { return '<div style="display:flex;gap:10px;font-size:13px;line-height:1.45"><span style="font-weight:600;color:#475467;min-width:40px">' + l.time + '</span><span style="color:' + LS[l.who] + '">' + LP[l.who] + esc(l.text) + '</span></div>'; }).join('') : '<div style="font-size:13px;color:#475467">No actions recorded yet. Every alert, action and override is logged here for audit and pilot evaluation.</div>') + '</section>';
    h += '</aside></div><footer class="muted">Illustrative mockup for Scope-AI-Thon 2026. All patients, values and timings are fictional. Thresholds shown are example settings, to be calibrated in the pilot.</footer></div>';
    document.getElementById('app').innerHTML = h;
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]'); if (!el) return;
    var a = el.getAttribute('data-a'), d = byseat(st.sel);
    if (a === 'chk') return;
    if (a === 'sel') { st.sel = el.getAttribute('data-s'); st.mode = null; st.err = ''; }
    else if (a === 'reset') { reset(); }
    else if (a === 'ack') { st.acked = true; addLogs('W-11', [['nurse', 'Acknowledged critical alert: going to bedside.'], ['system', 'Escalation timer stopped. Outcome must be logged within 15 min.']]); }
    else if (a === 'mode') { var m = el.getAttribute('data-m'); st.mode = st.mode === m ? null : m; st.err = ''; }
    else if (a === 'close') { st.mode = null; st.err = ''; }
    else if (a === 'all') {
      var n = 0, extra = [];
      d.steps.forEach(function (t, i) { var k = d.seat + '-' + i; if (!st.checked[k]) { st.checked[k] = true; n++;
        if (t.indexOf('every 30 to every 15') >= 0) { st.every[d.seat] = 15; extra.push(['system', 'In-person check interval set to 15 min.']); }
        if (t.indexOf('Flag to charge nurse') >= 0) extra.push(['system', 'Charge nurse notified.']); } });
      if (n) addLogs(d.seat, [['nurse', 'Accepted all ' + n + ' suggested steps.']].concat(extra));
    } else return;
    render();
  });
  document.addEventListener('change', function (e) {
    var el = e.target; if (el.getAttribute('data-a') !== 'chk') return;
    var d = byseat(st.sel), i = +el.getAttribute('data-i'), t = d.steps[i], k = d.seat + '-' + i;
    st.checked[k] = el.checked;
    if (el.checked) {
      var en = [['nurse', 'Accepted: ' + t]];
      if (t.indexOf('every 30 to every 15') >= 0) { st.every[d.seat] = 15; en.push(['system', 'In-person check interval set to 15 min; next check timer restarted from last check.']); }
      if (t.indexOf('Flag to charge nurse') >= 0) en.push(['system', 'Charge nurse notified.']);
      addLogs(d.seat, en);
    }
    render();
  });
  document.addEventListener('submit', function (e) {
    var f = e.target; if (!f.getAttribute('data-f')) return; e.preventDefault();
    var kind = f.getAttribute('data-f'), d = byseat(st.sel), seat = d.seat, v = function (n) { return f.elements[n] ? f.elements[n].value : ''; };
    var keep = {}; Array.prototype.forEach.call(f.elements, function (x) { if (x.name) keep[x.name] = x.value; });
    function fail(msg) { st.err = msg; render(); var nf = document.querySelector('form[data-f]'); if (nf) Object.keys(keep).forEach(function (n) { if (nf.elements[n]) nf.elements[n].value = keep[n]; }); }
    if (kind === 'reassess') {
      if (!v('imp')) return fail('Choose a nurse impression before saving.');
      st.handled[seat] = true; st.last[seat] = st.clock;
      var en = [['nurse', 'Bedside reassessment: impression ' + v('imp') + '; pain ' + v('pain') + '/10; ' + v('loc') + (v('note') ? '; ' + v('note') : '') + '.']];
      en.push(ALERT[d.st] ? ['system', 'Alert closed · response time ' + Math.max(1, st.clock - CH[seat][2]) + ' min · in-person check timer reset.'] : ['system', 'In-person check timer reset.']);
      en.push(v('imp') === 'Worse' || v('loc') !== 'Alert' ? ['ai', 'Risk re-scored with new findings: higher. Suggest considering up-triage and moving to a monitored space.'] : ['ai', 'Risk re-scored with new findings: unchanged. Continue current plan.']);
      if (seat === 'W-11') st.acked = true;
      addLogs(seat, en);
    } else if (kind === 'triage') {
      if (!v('newCtas')) return fail('Choose the new CTAS level.');
      if (!v('reason').trim()) return fail('Write a short reason. It is required for every CTAS change.');
      var n = +v('newCtas'), old = ctasOf(d);
      st.ctas[seat] = n; st.custom[seat] = 'High sensitivity (after up-triage)'; if (n <= 2) st.every[seat] = 15;
      addLogs(seat, [['nurse', 'Up-triaged CTAS ' + old + ' → ' + n + '. Reason: ' + v('reason').trim()], ['system', 'Moved up the physician and stretcher queue; charge nurse notified.' + (n <= 2 ? ' In-person checks every 15 min.' : '')], ['ai', 'Alarm profile switched to high sensitivity for the new acuity level.']]);
    } else if (kind === 'threshold') {
      var p = v('param'), fl = FLOOR[p], val = parseFloat(v('val'));
      if (v('val') === '' || isNaN(val)) return fail('Enter a number for the new limit.');
      if (fl.min !== undefined && val < fl.min) return fail('Below the safety floor (' + fl.min + '). A physician order is needed to go further.');
      if (fl.max !== undefined && val > fl.max) return fail('Above the safety ceiling (' + fl.max + '). A physician order is needed to go further.');
      if (!v('reason').trim()) return fail('Write a short reason. Every override is audited.');
      var until = hm(st.clock + 120);
      st.custom[seat] = (st.custom[seat] || d.profile) + ' · ' + PNAME[p] + ' ' + val + ' until ' + until;
      addLogs(seat, [['nurse', PNAME[p] + ' changed ' + fl.def + ' → ' + val + '. Reason: ' + v('reason').trim()], ['system', 'Override active until ' + until + ', then reverts automatically. Logged for audit.']]);
    }
    st.mode = null; st.err = ''; render();
  });
  render();
})();
</script>
